[project]
name = "devagent"
version = "0.1.0"
description = "Headless autonomous web-app builder (M1: skeleton + sandbox)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
devagent = "devagent.cli:main"

[tool.pytest.ini_options]
markers = [
    "docker: requires a running Docker daemon (containment + e2e tests)",
]

[tool.setuptools.packages.find]
include = ["devagent*"]
