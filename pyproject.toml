[project]
name = "devagent"
version = "0.1.0"
description = "Headless autonomous web-app builder: PRD or chat message in, verified deployed multi-service app out"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "anthropic>=0.69"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
feishu = ["lark-oapi"]   # inbound Feishu bot (channels/feishu_bot.py): WebSocket long-connection

[project.scripts]
devagent = "devagent.cli:main"

[tool.pytest.ini_options]
markers = [
    "docker: requires a running Docker daemon (containment + e2e tests)",
    "live: spends real API tokens; runs only with DEVAGENT_RUN_LIVE=1",
]

[tool.setuptools.packages.find]
include = ["devagent*"]
